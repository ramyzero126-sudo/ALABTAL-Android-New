
name: Build ALABTAL Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alabtal-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project files
        shell: bash
        run: |
          echo "=== PROJECT FILES ==="
          ls -la
          echo "=== ANDROID MANIFEST ==="
          cat -n app/src/main/AndroidManifest.xml
          echo "=== APP BUILD FILE ==="
          cat -n app/build.gradle

      - name: Validate AndroidManifest XML
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "app/src/main/AndroidManifest.xml"
          try:
              ET.parse(path)
              print("Manifest XML syntax is valid.")
          except Exception as exc:
              print(f"Manifest XML syntax error: {exc}")
              raise
          PY

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace --info

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALABTAL-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
