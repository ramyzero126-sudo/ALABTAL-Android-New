
name: Build ALABTAL Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alabtal-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnose AndroidManifest
        shell: bash
        run: |
          echo "=== MANIFEST LINE NUMBERS ==="
          nl -ba app/src/main/AndroidManifest.xml | head -n 20

          echo "=== MANIFEST RAW BYTES ==="
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          data = p.read_bytes()
          print("First 160 bytes:", repr(data[:160]))
          print("XML declaration count:", data.count(b"<?xml"))
          print("UTF-8 BOM:", data.startswith(b"\xef\xbb\xbf"))
          PY

          echo "=== VALIDATE XML ==="
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("app/src/main/AndroidManifest.xml")
          print("Manifest XML syntax is valid.")
          PY

      - name: Show project configuration
        shell: bash
        run: |
          echo "=== ROOT FILES ==="
          ls -la
          echo "=== SETTINGS ==="
          cat -n settings.gradle
          echo "=== ROOT BUILD ==="
          cat -n build.gradle
          echo "=== APP BUILD ==="
          cat -n app/build.gradle

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace --info

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALABTAL-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
