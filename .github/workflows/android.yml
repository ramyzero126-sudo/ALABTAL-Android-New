
name: Build ALABTAL Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alabtal-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Repair and validate AndroidManifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          path = Path("app/src/main/AndroidManifest.xml")
          data = path.read_text(encoding="utf-8-sig").lstrip()

          # Convert HTML-escaped XML delimiters back to actual XML.
          data = data.replace("&lt;", "<").replace("&gt;", ">")
          data = data.replace("&quot;", '"')

          # Decode escaped ampersands only when not part of an XML entity.
          data = re.sub(
              r"&amp;(?!amp;|lt;|gt;|quot;|apos;|#\d+;|#x[0-9a-fA-F]+;)",
              "&",
              data
          )

          # Ensure the XML declaration is at the beginning only once.
          declaration = '<?xml version="1.0" encoding="utf-8"?>'
          data = re.sub(r'<\?xml[^?]*\?>', '', data).lstrip()
          if data.startswith("<manifest"):
              data = declaration + "\n" + data
          elif data.startswith(declaration):
              pass
          else:
              raise SystemExit("Manifest does not begin with a valid XML root.")

          path.write_text(data.rstrip() + "\n", encoding="utf-8")
          ET.parse(path)

          print("Manifest repaired and XML syntax is valid.")
          print("First lines:")
          for i, line in enumerate(path.read_text().splitlines()[:5], 1):
              print(f"{i}: {line}")
          PY

      - name: Show project configuration
        shell: bash
        run: |
          echo "=== PROJECT FILES ==="
          ls -la
          echo "=== SETTINGS ==="
          cat -n settings.gradle
          echo "=== ROOT BUILD ==="
          cat -n build.gradle
          echo "=== APP BUILD ==="
          cat -n app/build.gradle

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace --info

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALABTAL-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
